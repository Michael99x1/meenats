<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C687"/>
      <stop offset="0.5" stop-color="#D4AF63"/>
      <stop offset="1" stop-color="#A9791F"/>
    </linearGradient>
  </defs>

  <!-- outer navy disc -->
  <circle cx="100" cy="100" r="94" fill="#13294B"/>
  <!-- gold ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#D4AF63" stroke-width="1" opacity="0.35"/>

  <!-- monogram -->
  <text x="100" y="126" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="600" font-size="98" fill="#F0F1EC">M</text>

  <!-- ECG pulse accent, echoes the site's heartbeat divider -->
  <path d="M46 150 H80 L86 150 L90 140 L95 160 L99 150 L104 150 L108 143 L111 156 L115 150 H154"
        fill="none" stroke="#D4AF63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
